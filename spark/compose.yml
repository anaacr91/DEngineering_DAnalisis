services:  
  master:
    image: apache/spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master -h master
    hostname: master
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
      SPARK_MODE: master
      SPARK_MASTER_URL: spark://master:7077
      SPARK_PUBLIC_DNS: localhost
    expose:
      - 7001
      - 7002
      - 7003
      - 7004
      - 7005
      - 7077
      - 6066
    ports:
      - 4040:4040
      - 6066:6066
      - 7077:7077
      - 8080:8080
    volumes:
      - ./conf/master/spark-default.conf:/opt/spark/conf/spark-default.conf
      - ./data:/tmp/data
      - ./scripts:/opt/spark/work-dir/scripts

  worker:
    image: apache/spark:latest
    scale: 1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://master:7077
    hostname: worker
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_PORT: 8881
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_PUBLIC_DNS: localhost
    links:
      - master
    expose:
      - 7012
      - 7013
      - 7014
      - 7015
      - 8881
      - 8081
    volumes:
      - ./conf/worker/spark-default.conf:/opt/spark/conf/spark-default.conf
      - ./data:/tmp/data
